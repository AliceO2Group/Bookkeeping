openapi: 3.1.0
info:
  title: Bookkeeping HTTP API
  version: 0.1.0-pilot
  description: |
    HTTP API of the ALICE Bookkeeping. **Internal use only.**

    > Work in progress: not every resource is documented yet. Only the sections listed below exist.

    ## Authentication
    Every request carries a JWT in the `token` **query parameter** (e.g. `GET /api/tags?token=<jwt>`).
    The token's `access` claim lists the user's roles; operations marked with a role below return `403` otherwise.

    ## Response envelope
    Successful responses are `{ "data": ... }`, with `meta.page` added on paginated endpoints.
    Failed responses are `{ "errors": [ { status, title, detail?, source? } ] }`.
    Note that request-validation failures are sent with **HTTP 400** while each error's `status` field says `"422"`.

    ## Conventions
    - Filters use bracket syntax: `filter[partialText]=foo`. List-valued filters are comma separated: `filter[ids]=1,2,3`.
    - Pagination uses `page[limit]` and `page[offset]`.
    - Timestamps are Unix epoch **milliseconds**.
    - Operations flagged `x-llm-exclude: true` change data and are **not meant for LLMs or MCP tools**; skip them when generating tools.

    ## Instructions for LLMs and automated agents
    - **Always paginate** when an endpoint supports `page[limit]` and `page[offset]`. Never rely on the default: when `page[limit]` is omitted the server
      may return up to 5000 items, which is far too much for a model context.
    - **Request at most 100 items per call** (`page[limit]=100`). This is a rule for LLMs and agents, not a server limit (the server accepts more).
    - To read more, repeat the call increasing `page[offset]` by the limit until `offset` reaches `meta.page.totalCount`.
    - Prefer narrowing the request with `filter[...]` parameters over reading everything and filtering afterwards.
    - Endpoints that are not paginated (for example `GET /tags`) return everything: use their filters.
    - Do not call operations flagged `x-llm-exclude: true`: they create, change or delete data.
servers:
  - url: /api
security:
  - jwtQuery: []
tags:
  - name: Tags
    description: Labels attached to logs (and runs). Each tag may notify an e-mail list and a Mattermost channel.
  - name: Status
    description: Health of the Bookkeeping application and of its database.
  - name: Configuration
    description: Addresses of the external services Bookkeeping links to.
  - name: Detectors
    description: Detectors of the ALICE experiment.
  - name: Run types
    description: Types of runs (e.g. calibration kinds).
  - name: CTP trigger counters
    description: Counters of the central trigger processor, per run and trigger class.
  - name: Shifts
    description: Data used to fill end-of-shift reports.
  - name: Simulation passes
    description: Monte Carlo simulation productions.
  - name: LHC periods statistics
    description: LHC periods with statistics on their physics runs.
  - name: GAQ detectors
    description: Detectors whose QC flags contribute to the global aggregated quality (GAQ) of a run in a data pass.
  - name: End of shift reports
    description: End-of-shift (EoS) reports written by the shifters.
  - name: Attachments
    description: Files attached to log entries.
  - name: DPL processes
    description: Processes of the data processing layer (DPL) executed during the runs, by detector, process and host.
  - name: FLPs
    description: Roles of FLPs in runs, with their data counters.

paths:
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags
      description: |
        Returns every tag matching the filters, **not paginated**.
        Returns `204 No Content` (empty body) when nothing matches, so clients must not assume a JSON body.
      parameters:
        - name: filter[ids]
          in: query
          description: Comma separated tag ids.
          schema: { type: string, examples: ['1,2,3'] }
        - name: filter[texts]
          in: query
          description: Comma separated exact tag texts. Takes precedence over `filter[partialText]`.
          schema: { type: string, examples: ['FOOD,DRINK'] }
        - name: filter[partialText]
          in: query
          description: Substring match on the tag text. Ignored when `filter[texts]` is given.
          schema: { type: string, examples: ['-TAG-'] }
        - name: filter[emails]
          in: query
          description: Comma separated e-mail addresses.
          schema: { type: string }
        - name: filter[mattermosts]
          in: query
          description: Comma separated Mattermost channel names.
          schema: { type: string }
      responses:
        '200':
          description: Matching tags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
        '204': { description: "No tag matches the filters. No body." }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tags]
      operationId: createTag
      x-llm-exclude: true
      summary: Create a tag
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTag' }
            example:
              text: FOOD
              description: Food related issues
              email: cake@cern.ch,test@cern.ch
              mattermost: food-channel
              color: '#ff8800'
      responses:
        '201':
          description: The created tag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A tag with the same text already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - status: 409
                    title: The request conflicts with existing data
                    detail: The provided entity already exists

  /tags/name:
    get:
      tags: [Tags]
      operationId: getTagByName
      summary: Get a tag by its text
      description: Looks a tag up by its exact text (case as stored). Use this when you know the label but not the id.
      parameters:
        - name: name
          in: query
          required: true
          description: Exact tag text. Must be URL-encoded.
          schema: { type: string, examples: ['FOOD'] }
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [Tags]
      operationId: getTagById
      summary: Get a tag by id
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tags]
      operationId: updateTag
      x-llm-exclude: true
      summary: Update a tag
      description: |
        Only `description`, `email`, `mattermost`, `color` and `archivedAt` can change;
        the tag `text` is immutable. Set `archivedAt` to a date to archive the tag and to `null` to restore it.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTag' }
            example:
              description: Updated description
              archivedAt: null
      responses:
        '201':
          description: The updated tag. (Status is `201`, not `200`.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tags]
      operationId: deleteTag
      x-llm-exclude: true
      summary: Delete a tag
      x-required-roles: [admin]
      responses:
        '200':
          description: The deleted tag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tags/{tagId}/logs:
    parameters:
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [Tags]
      operationId: listLogsByTag
      summary: List logs carrying a tag
      parameters:
        - name: page[limit]
          in: query
          description: Maximum number of logs to return. LLMs and agents must use 100 or less.
          schema: { type: integer, minimum: 1, examples: [100] }
        - name: page[offset]
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of logs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: Log entities (see the Logs resource, not yet documented).
                    items: { type: object, additionalProperties: true }
                  meta:
                    type: object
                    properties:
                      page:
                        type: object
                        properties:
                          pageCount: { type: integer }
                          totalCount: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /status/database:
    get:
      tags: [Status]
      operationId: getDatabaseStatus
      summary: Get the database connection status
      description: Pings the database. `status.ok` is false when it cannot be reached.
      responses:
        '200':
          description: The database host, port and status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStatusResponse' }
              example:
                data: { host: database, port: 3306, status: { ok: true, configured: true } }

  /status/gui:
    get:
      tags: [Status]
      operationId: getGuiStatus
      summary: Get the status of the Bookkeeping application
      description: Returns the host, port and version of the running Bookkeeping server that answered the request.
      responses:
        '200':
          description: The application host, port, version and status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStatusResponse' }
              example:
                data: { host: localhost, port: 4000, version: 1.20.0, status: { ok: true, configured: true } }

  /configuration:
    get:
      tags: [Configuration]
      operationId: getConfiguration
      summary: Get the URLs of the external services
      description: |
        Returns the addresses of the services Bookkeeping links to (InfoLogger, AliECS GUI, QC GUI, ali-flp-index).
        A URL is `null` when the service is not configured on this deployment.
      responses:
        '200':
          description: The configured URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
              example:
                data:
                  FlpInfologgerUrl: http://localhost:8081
                  EpnInfologgerUrl: null
                  AliFlpIndexUrl: http://localhost:80
                  QcGuiUrl: http://localhost:8082
                  AliEcsGuiUrl: http://localhost:8080

  /detectors:
    get:
      tags: [Detectors]
      operationId: listDetectors
      summary: List all detectors
      description: Returns every detector, sorted alphabetically by name. Not paginated.
      responses:
        '200':
          description: The detectors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectorListResponse' }
              example:
                data:
                  - { id: 17, name: ACO, type: PHYSICAL }
                  - { id: 21, name: GLO, type: QC }

  /runTypes:
    get:
      tags: [Run types]
      operationId: listRunTypes
      summary: List run types
      description: |
        Returns the run types ordered by name, **descending**. Not paginated: there are few run types, and the result is capped to the maximum number of
        items of the API (5000 by default). Pagination parameters are rejected.
      responses:
        '200':
          description: The run types.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTypeListResponse' }
              example:
                data:
                  - { id: 3, name: CALIBRATION_VCASN_TUNING }
                  - { id: 1, name: NONE }
        '400': { $ref: '#/components/responses/ValidationError' }

  /runTypes/{runTypeId}:
    get:
      tags: [Run types]
      operationId: getRunType
      summary: Get a run type by id
      parameters:
        - name: runTypeId
          in: path
          required: true
          description: Run type identifier.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The run type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No run type has this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 404, title: Not found, detail: Run type with this id (999999999) could not be found }

  /ctp-trigger-counters/{runNumber}:
    get:
      tags: [CTP trigger counters]
      operationId: listCtpTriggerCountersOfRun
      summary: List the CTP trigger counters of a run
      description: |
        Returns the trigger counters of every trigger class recorded for the run. Not paginated.
        A run without counters gives `200` with an empty list. A run that does not exist gives `404`.
      parameters:
        - name: runNumber
          in: path
          required: true
          description: Run number.
          schema: { type: integer, minimum: 1, examples: [106] }
      responses:
        '200':
          description: The counters, one entry per trigger class.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CtpTriggerCountersListResponse' }
              example:
                data:
                  - { id: 1, runNumber: 106, className: minbias, timestamp: 1704067200000, lmb: 10, lma: 9, l0b: 8, l0a: 7, l1b: 6, l1a: 5 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No run has this run number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 404, title: Not found, detail: Run with this run number (999999999) could not be found }

  /shift-data:
    get:
      tags: [Shifts]
      operationId: getShiftData
      summary: Get the data of the pending shift of the calling user
      description: |
        Returns what a shifter needs to write their end-of-shift (EoS) report for the **pending shift**: the current shift, or the previous one
        during the 30 minutes that follow its end. Shifts last 8 hours and are Night (23h-7h), Morning (7h-15h) and Afternoon (15h-23h) in the
        Geneva time zone. The shift is deduced from the current time and the calling user, not from a parameter.

        `typeSpecific` depends on `shiftType`: `{ environments }` for `ECS`, `{ runs }` for `QC/PDP`, `{ runs, tagsCounters }` for `SL`, and `null`
        for `SLIMOS` and `DCS`.
      parameters:
        - name: shiftType
          in: query
          required: true
          description: Kind of shift.
          schema: { type: string, enum: [ECS, QC/PDP, SLIMOS, SL, DCS], examples: [ECS] }
      responses:
        '200':
          description: The shift data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftDataResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The calling user is not known to Bookkeeping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /simulationPasses:
    get:
      tags: [Simulation passes]
      operationId: listSimulationPasses
      summary: List simulation passes
      description: |
        Returns a page of simulation passes with their statistics (number of runs, data passes and logs).
        Default order is by name, descending.

        List filters are repeated query parameters: `filter[ids][]=1&filter[ids][]=2`. A single value without `[]` is rejected. Filters are combined
        with AND.
      parameters:
        - name: filter[ids][]
          in: query
          description: Keep the simulation passes with one of these ids. Repeat the parameter for several values.
          schema: { type: integer }
        - name: filter[names][]
          in: query
          description: Keep the simulation passes with one of these exact names. Repeat the parameter for several values.
          schema: { type: string, examples: [LHC23k6b] }
        - name: filter[lhcPeriodIds][]
          in: query
          description: Keep the simulation passes used by data passes of one of these LHC periods. Repeat the parameter for several values.
          schema: { type: integer }
        - name: filter[dataPassIds][]
          in: query
          description: Keep the simulation passes anchored to one of these data passes. Repeat the parameter for several values.
          schema: { type: integer }
        - name: sort[id]
          in: query
          description: Sort by id.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[name]
          in: query
          description: Sort by name (the default is `desc`).
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[pwg]
          in: query
          description: Sort by physics working group.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[jiraId]
          in: query
          description: Sort by Jira ticket.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[requestedEventsCount]
          in: query
          description: Sort by number of requested events.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[generatedEventsCount]
          in: query
          description: Sort by number of generated events.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[outputSize]
          in: query
          description: Sort by output size.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: A page of simulation passes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationPassListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /simulationPasses/{id}:
    get:
      tags: [Simulation passes]
      operationId: getSimulationPass
      summary: Get a simulation pass by id
      parameters:
        - name: id
          in: path
          required: true
          description: Simulation pass identifier.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The simulation pass.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationPassResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No simulation pass has this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 404, title: Not found, detail: Simulation pass with this id (99999) could not be found }

  /lhcPeriodsStatistics:
    get:
      tags: [LHC periods statistics]
      operationId: listLhcPeriodsStatistics
      summary: List LHC periods with their statistics
      description: |
        Returns a page of LHC periods with statistics computed on their **physics runs**: number of runs, average center-of-mass energy, distinct
        energies, PDP beam types and number of data and simulation passes. Default order is by id, descending.

        List filters are repeated query parameters: `filter[ids][]=1&filter[ids][]=2`. A single value without `[]` is rejected. Unknown query
        parameters are rejected.
      parameters:
        - name: filter[ids][]
          in: query
          description: Keep the LHC periods with one of these ids. Repeat the parameter for several values.
          schema: { type: integer }
        - name: filter[names][]
          in: query
          description: Keep the LHC periods with one of these exact names. Repeat the parameter for several values.
          schema: { type: string, examples: [LHC22b] }
        - name: filter[years][]
          in: query
          description: Keep the LHC periods of these years. The year is read from the period name (`LHC23f` is 2023). Repeat the parameter for several values.
          schema: { type: integer, examples: [2023] }
        - name: filter[pdpBeamTypes][]
          in: query
          description: Keep the LHC periods having runs of one of these PDP beam types. Repeat the parameter for several values.
          schema: { type: string, examples: [pp] }
        - name: sort[id]
          in: query
          description: Sort by id (the default is `desc`).
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[name]
          in: query
          description: Sort by name.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[avgCenterOfMassEnergy]
          in: query
          description: Sort by average center-of-mass energy.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[year]
          in: query
          description: Sort by year.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[pdpBeamTypes]
          in: query
          description: Sort by PDP beam types.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: A page of LHC periods with statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LhcPeriodStatisticsListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /lhcPeriodsStatistics/{lhcPeriodId}:
    get:
      tags: [LHC periods statistics]
      operationId: getLhcPeriodStatistics
      summary: Get the statistics of an LHC period
      parameters:
        - name: lhcPeriodId
          in: path
          required: true
          description: LHC period identifier.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The LHC period with its statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LhcPeriodStatisticsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No LHC period has this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /gaqDetectors:
    get:
      tags: [GAQ detectors]
      operationId: listGaqDetectors
      summary: List the detectors contributing to the GAQ of a run in a data pass
      description: |
        Returns the detectors whose QC flags contribute to the global aggregated quality (GAQ) of a run in a data pass, sorted by name. Not paginated.
        The list is empty when no detector is set for this run and data pass, **or when the run or the data pass does not exist** (never `404`).
      parameters:
        - name: dataPassId
          in: query
          required: true
          description: Data pass identifier.
          schema: { type: integer, minimum: 1, examples: [3] }
        - name: runNumber
          in: query
          required: true
          description: Run number.
          schema: { type: integer, minimum: 1, examples: [56] }
      responses:
        '200':
          description: The detectors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectorListResponse' }
              example:
                data:
                  - { id: 7, name: FT0, type: PHYSICAL }
                  - { id: 4, name: ITS, type: PHYSICAL }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [GAQ detectors]
      operationId: setGaqDetectors
      x-llm-exclude: true
      x-required-roles: [admin, gaq]
      summary: Set the detectors contributing to the GAQ of runs in a data pass
      description: |
        Requires the role `admin` or `gaq`. For each given run, replaces the detectors contributing to the GAQ in the data pass by the given ones.
        Every run must be linked to the data pass and have every given detector.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetGaqDetectors' }
            example:
              dataPassId: 3
              runNumbers: [49, 56]
              detectorIds: [4, 7]
      responses:
        '201':
          description: The created associations between runs and detectors, one per run and detector.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GaqDetectorEntriesResponse' }
              example:
                data:
                  - { dataPassId: 3, runNumber: 49, detectorId: 4 }
                  - { dataPassId: 3, runNumber: 49, detectorId: 7 }
        '400':
          description: |
            The request failed validation (see the validation errors format), **or** a run is not linked to the data pass, a detector does not exist or
            a run does not have a given detector. In these last cases the error has `title: Service unavailable` and the reason in `detail`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 400, title: Service unavailable, detail: 'No association between data pass with id 3 and following runs: 1' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The data pass does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 404, title: Not found, detail: Data pass with this id (99999) could not be found }

  /eos-report:
    post:
      tags: [End of shift reports]
      operationId: createEosReport
      x-llm-exclude: true
      summary: Create the end-of-shift report of the calling user
      description: |
        Creates the end-of-shift (EoS) report of the **pending shift** of the calling user (see `GET /shift-data`) as a log entry. The start of the shift is
        deduced from the current time and must **not** be given in the body.

        The text of the report is generated from the body and from the data of the shift (issues, environments, runs...), the log is linked to the runs and to
        the environments of the shift and is tagged with the tags of the shift type that exist.
      parameters:
        - name: reportType
          in: query
          required: true
          description: Kind of shift the report is about.
          schema: { type: string, enum: [ECS, QC/PDP, SLIMOS, SL, DCS], examples: [ECS] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEosReport' }
            example:
              shifterName: John Doe
              shiftFlow: The shift flow
              infoForNextShifter: Info for the next shifter
              typeSpecific:
                environmentComments: { ENV1: A comment about the environment }
                runComments: { '200': A comment about the run }
      responses:
        '201':
          description: The log entry created for the report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EosReportResponse' }
              example:
                data: { id: 120, title: End of shift report - ECS - 17/03/2023 Morning }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The calling user is not known to Bookkeeping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors:
                  - { status: 404, title: Not found, detail: User with this external id (1) could not be found }

  /attachments:
    post:
      tags: [Attachments]
      operationId: createAttachment
      x-llm-exclude: true
      summary: Upload a file as an attachment
      description: |
        Uploads **one** file (multipart request) and stores it as an attachment, linked to a log if `log` is given.

        The files of a request are all written on the server, but only the first one is stored as an attachment. A request without any file is rejected with a `400`.
        Logs and their attachments are usually created together with `POST /logs`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateAttachment' }
            example:
              log: 1
              attachments: '@/path/to/file.png'
      responses:
        '201':
          description: The stored attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAttachmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /attachments/{attachmentId}:
    get:
      tags: [Attachments]
      operationId: getAttachmentFile
      summary: Download the file of an attachment
      description: Returns the content of the file, with the type of the file as `Content-Type`. Use `curl -OJ` to save it with the name given by the server.
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment identifier.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No attachment has this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                errors: [{ status: 404, title: Not found, detail: Attachment with this id (999999999) could not be found }]

  /dpl-process/detectors:
    get:
      tags: [DPL processes]
      operationId: listDplDetectorsWithExecutedProcesses
      summary: List the detectors having an executed process in a run
      description: |
        Returns the detectors that have at least one executed DPL process in the run, sorted by name. Not paginated. This is the first level of the
        run details tree of DPL processes: detector, then process (`/dpl-process/processes`), then host (`/dpl-process/hosts`), then executions
        (`/dpl-process/executions`).
      parameters:
        - $ref: '#/components/parameters/DplRunNumber'
      responses:
        '200':
          description: The detectors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DplDetectorListResponse' }
              example:
                data:
                  - { id: 1, name: CPV, processesExecutions: [] }
                  - { id: 2, name: EMC, processesExecutions: [] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/DplNotFound' }

  /dpl-process/processes:
    get:
      tags: [DPL processes]
      operationId: listDplProcessesExecutedForDetector
      summary: List the processes executed for a detector in a run
      description: Returns the DPL processes that have been executed at least once in the run for the detector, sorted by name, with their type. Not paginated.
      parameters:
        - $ref: '#/components/parameters/DplRunNumber'
        - $ref: '#/components/parameters/DplDetectorId'
      responses:
        '200':
          description: The processes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DplProcessListResponse' }
              example:
                data:
                  - { id: 1, name: PROCESS-1, typeId: 1, type: { id: 1, label: QcTask }, processesExecutions: [] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/DplNotFound' }

  /dpl-process/hosts:
    get:
      tags: [DPL processes]
      operationId: listHostsExecutingDplProcess
      summary: List the hosts on which a process was executed for a detector in a run
      description: Returns the hosts on which the DPL process has been executed at least once in the run for the detector, sorted by host name. Not paginated.
      parameters:
        - $ref: '#/components/parameters/DplRunNumber'
        - $ref: '#/components/parameters/DplDetectorId'
        - $ref: '#/components/parameters/DplProcessId'
      responses:
        '200':
          description: The hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostListResponse' }
              example:
                data:
                  - { id: 1, hostname: flp001, processesExecutions: [] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/DplNotFound' }

  /dpl-process/executions:
    get:
      tags: [DPL processes]
      operationId: listDplProcessExecutions
      summary: List the executions of a process on a host for a detector in a run
      description: Returns the executions of the DPL process on the host in the run for the detector. Not paginated.
      parameters:
        - $ref: '#/components/parameters/DplRunNumber'
        - $ref: '#/components/parameters/DplDetectorId'
        - $ref: '#/components/parameters/DplProcessId'
        - name: hostId
          in: query
          required: true
          description: Host identifier.
          schema: { type: integer, minimum: 1, examples: [1] }
      responses:
        '200':
          description: The executions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DplProcessExecutionListResponse' }
              example:
                data:
                  - { id: 1, hostId: 1, processId: 1, detectorId: 1, runNumber: 106, args: --id QcTask, detector: null, host: null, process: null, run: null }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/DplNotFound' }

  /flps:
    get:
      tags: [FLPs]
      operationId: listFlps
      summary: List the FLP roles
      description: |
        Returns the roles of FLPs (one entry per FLP and per run) with their data counters. Paginated, sorted by name descending by default.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: sort[id]
          in: query
          description: Sort by identifier.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[name]
          in: query
          description: Sort by FLP name.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[hostname]
          in: query
          description: Sort by host name.
          schema: { $ref: '#/components/schemas/SortOrder' }
        - name: sort[runNumber]
          in: query
          description: Sort by run number.
          schema: { $ref: '#/components/schemas/SortOrder' }
      responses:
        '200':
          description: A page of FLP roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlpListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [FLPs]
      operationId: createFlp
      summary: Create an FLP role
      description: Creates the role of an FLP in a run.
      x-llm-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFlp' }
            example: { name: FLP-1, hostname: flp001.cern.ch, runNumber: 106 }
      responses:
        '201':
          description: The created FLP role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /flps/{flpId}:
    get:
      tags: [FLPs]
      operationId: getFlp
      summary: Get an FLP role
      description: Returns one FLP role, with its run.
      parameters:
        - name: flpId
          in: path
          required: true
          description: FLP role identifier.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The FLP role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /flps/{flpName}/runs/{runNumber}:
    patch:
      tags: [FLPs]
      operationId: updateFlp
      summary: Update the counters of an FLP in a run
      description: |
        Replaces the data counters of the FLP role identified by FLP name and run number. Counters absent from the body are set to null.
        Responds 400 if the run or the FLP in this run does not exist.
      x-llm-exclude: true
      parameters:
        - name: flpName
          in: path
          required: true
          description: Name of the FLP.
          schema: { type: string }
        - name: runNumber
          in: path
          required: true
          description: Run number.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFlp' }
            example: { nTimeframes: 1000, bytesProcessed: 2048 }
      responses:
        '201':
          description: The updated FLP role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    jwtQuery:
      type: apiKey
      in: query
      name: token
      description: JWT identifying the user. Its `access` claim carries the roles (e.g. `admin`, `guest`).

  parameters:
    TagId:
      name: tagId
      in: path
      required: true
      description: Tag identifier.
      schema: { type: integer, minimum: 1 }


    PageLimit:
      name: page[limit]
      in: query
      description: Maximum number of items to return. LLMs and agents must use 100 or less.
      schema: { type: integer, minimum: 1, examples: [100] }
    PageOffset:
      name: page[offset]
      in: query
      description: Number of items to skip.
      schema: { type: integer, minimum: 0, default: 0 }

    DplRunNumber:
      name: runNumber
      in: query
      required: true
      description: Run number.
      schema: { type: integer, minimum: 1, examples: [106] }
    DplDetectorId:
      name: detectorId
      in: query
      required: true
      description: Identifier of the detector (the detectors of `GET /detectors`).
      schema: { type: integer, minimum: 1, examples: [1] }
    DplProcessId:
      name: processId
      in: query
      required: true
      description: Identifier of the DPL process.
      schema: { type: integer, minimum: 1, examples: [1] }

  responses:
    ValidationError:
      description: |
        The request failed validation. HTTP status is 400 although each error's `status` field is `"422"`.
        `source.pointer` has the form `/data/attributes/<query|params|body>/<field>`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            errors:
              - status: '422'
                source: { pointer: /data/attributes/params/tagId }
                title: Invalid Attribute
                detail: '"params.tagId" must be a number'
    Forbidden:
      description: The token lacks the role required by this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            errors: [{ status: '403', title: Access denied }]
    NotFound:
      description: The requested entity does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            errors: [{ status: '404', title: 'Tag with this id (999999999) could not be found' }]

    DplNotFound:
      description: The run, the detector, the process or the host does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            errors:
              - { status: 404, title: Not found, detail: Run with this run number (999) could not be found }

  schemas:
    Tag:
      type: object
      required: [id, text, archived, updatedAt]
      properties:
        id: { type: integer, minimum: 1 }
        text: { type: string, minLength: 2, maxLength: 20, description: "Unique label. Immutable." }
        description: { type: [string, 'null'], maxLength: 100 }
        email:
          type: [string, 'null']
          description: Comma separated e-mail addresses notified when the tag is used.
        mattermost: { type: [string, 'null'], description: "Mattermost channel notified when the tag is used." }
        color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex colour, e.g. `#ff8800`.
        archived: { type: boolean, description: "True when `archivedAt` is set." }
        archivedAt: { type: [integer, 'null'], description: "Epoch milliseconds, null if not archived." }
        lastEditedBy:
          type: [object, 'null']
          properties:
            name: { type: string }
        updatedAt: { type: integer, description: "Epoch milliseconds." }
    TagResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Tag' }
    CreateTag:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '[\w|\-+]{1,}'
          description: Words, digits, `-` and `+` only.
        description: { type: [string, 'null'], maxLength: 100 }
        mattermost: { type: [string, 'null'] }
        email:
          type: [string, 'null']
          description: One or more e-mail addresses, comma separated.
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
    UpdateTag:
      type: object
      description: All properties optional; `text` cannot be changed.
      properties:
        description: { type: [string, 'null'], maxLength: 100 }
        mattermost: { type: [string, 'null'] }
        email: { type: [string, 'null'], description: "One or more e-mail addresses, comma separated." }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        archivedAt: { type: [string, integer, 'null'], format: date-time, description: "Date to archive the tag, either an ISO 8601 date-time string or epoch milliseconds, null to restore it." }
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [status, title]
            properties:
              status: { type: [string, integer] }
              title: { type: string }
              detail: { type: string }
              source:
                type: object
                properties:
                  pointer: { type: string }
    ServiceStatus:
      type: object
      required: [host, port, status]
      properties:
        host: { type: string }
        port: { type: integer }
        version: { type: string, description: Version of the Bookkeeping application. Only present on the application status. }
        status:
          type: object
          required: [ok, configured]
          properties:
            ok: { type: boolean, description: False when the service cannot be reached. }
            configured: { type: boolean }
    ServiceStatusResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ServiceStatus' }
    Configuration:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            FlpInfologgerUrl: { type: [string, 'null'], description: FLP InfoLogger GUI. }
            EpnInfologgerUrl: { type: [string, 'null'], description: EPN InfoLogger GUI. }
            AliFlpIndexUrl: { type: [string, 'null'], description: ali-flp-index page. }
            QcGuiUrl: { type: [string, 'null'], description: Quality Control GUI. }
            AliEcsGuiUrl: { type: [string, 'null'], description: AliECS GUI. }
    Detector:
      type: object
      required: [id, name, type]
      properties:
        id: { type: integer }
        name: { type: string, description: 'Detector code, e.g. `ITS`.' }
        type:
          type: string
          enum: [PHYSICAL, QC, AOT-GLO, AOT-EVENT, MUON-GLO, VIRTUAL, OTHER]
          description: Kind of detector. Only `PHYSICAL` and `VIRTUAL` detectors can take part in data taking.
    DetectorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Detector' }
    RunType:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, description: 'Run type name, e.g. `NONE` or `CALIBRATION_THR_SCAN`.' }
    RunTypeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RunType' }
    RunTypeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RunType' }
    CtpTriggerCounters:
      type: object
      description: Counters of one CTP trigger class of a run (LM, L0 and L1 levels, before and after vetoes).
      properties:
        id: { type: integer }
        runNumber: { type: integer }
        className: { type: string, description: Name of the trigger class. }
        timestamp: { type: integer, description: Epoch milliseconds of the measurement. }
        lmb: { type: integer, description: LM level counter before vetoes. }
        lma: { type: integer, description: LM level counter after vetoes. }
        l0b: { type: integer, description: L0 level counter before vetoes. }
        l0a: { type: integer, description: L0 level counter after vetoes. }
        l1b: { type: integer, description: L1 level counter before vetoes. }
        l1a: { type: integer, description: L1 level counter after vetoes. }
    CtpTriggerCountersListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CtpTriggerCounters' }
    Shift:
      type: object
      required: [start, end, period]
      properties:
        start: { type: integer, description: Epoch milliseconds. }
        end: { type: integer, description: Epoch milliseconds. }
        period: { type: string, enum: [Night, Morning, Afternoon] }
    ShiftData:
      type: object
      required: [shift, issuesLogs, typeSpecific, infoFromPreviousShifter]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        issuesLogs:
          type: array
          description: Log entries of the shift carrying the tags of the shift type, EoS reports excluded (see the Logs resource).
          items: { type: object, additionalProperties: true }
        typeSpecific:
          type: [object, 'null']
          description: Depends on the shift type, see the operation description.
          properties:
            environments: { type: array, description: 'ECS shift only.', items: { type: object, additionalProperties: true } }
            runs:
              type: object
              description: QC/PDP and SL shifts only. Runs of the shift grouped by run definition.
              additionalProperties: { type: array, items: { type: object, additionalProperties: true } }
            tagsCounters:
              type: object
              description: SL shift only. Number of root logs of the shift per tag text, EoS reports excluded.
              additionalProperties: { type: integer }
        infoFromPreviousShifter:
          type: object
          description: The "For next shifter" section of the EoS report of the previous shift. Exactly one of the properties is set.
          properties:
            value: { type: string }
            errorMessage: { type: string, description: 'Why nothing could be retrieved (no report, several reports, empty section...).' }
    ShiftDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ShiftData' }
    PageMeta:
      type: object
      description: Pagination information of a list response.
      properties:
        page:
          type: object
          properties:
            pageCount: { type: integer, description: 'Number of pages for the requested `page[limit]`.' }
            totalCount: { type: integer, description: 'Number of items matching the request, all pages included.' }
    SortOrder:
      type: string
      enum: [asc, desc, ASC, DESC]
    SimulationPass:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, examples: [LHC23k6b] }
        jiraId: { type: [string, 'null'], description: Jira ticket of the simulation request., examples: [SIMTICKET-2] }
        description: { type: [string, 'null'] }
        pwg: { type: [string, 'null'], description: Physics working group., examples: [PWGX1] }
        requestedEventsCount: { type: [integer, 'null'] }
        generatedEventsCount: { type: [integer, 'null'] }
        outputSize: { type: [integer, 'null'], description: Size of the output in bytes. }
        runsCount: { type: integer, description: Number of runs of the simulation pass. }
        dataPassesCount: { type: integer, description: Number of data passes anchored to the simulation pass. }
        logsCount: { type: integer, description: Number of logs linked to the simulation pass. }
        pdpBeamTypes:
          type: array
          description: PDP beam types of the runs.
          items: { type: string, examples: [PbPb] }
    SimulationPassResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SimulationPass' }
    SimulationPassListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SimulationPass' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    LhcPeriodStatistics:
      type: object
      properties:
        id: { type: integer }
        lhcPeriod:
          type: [object, 'null']
          properties:
            id: { type: integer }
            name: { type: string, examples: [LHC22b] }
        avgCenterOfMassEnergy: { type: [number, 'null'], description: Average over the physics runs. }
        distinctEnergies:
          type: array
          description: Distinct center-of-mass energies of the physics runs.
          items: { type: number }
        pdpBeamTypes:
          type: array
          items: { type: string, examples: [pp] }
        runsCount: { type: integer, description: Number of physics runs. }
        dataPassesCount: { type: integer }
        simulationPassesCount: { type: integer }
    LhcPeriodStatisticsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LhcPeriodStatistics' }
    LhcPeriodStatisticsListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LhcPeriodStatistics' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    SetGaqDetectors:
      type: object
      required: [dataPassId, runNumbers, detectorIds]
      properties:
        dataPassId: { type: integer, minimum: 1 }
        runNumbers:
          type: array
          description: Run numbers of the runs to update, without duplicates.
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        detectorIds:
          type: array
          description: Ids of the detectors contributing to the GAQ, without duplicates.
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    GaqDetectorEntry:
      type: object
      required: [dataPassId, runNumber, detectorId]
      properties:
        dataPassId: { type: integer }
        runNumber: { type: integer }
        detectorId: { type: integer }
    GaqDetectorEntriesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/GaqDetectorEntry' }
    CreateEosReport:
      type: object
      required: [typeSpecific]
      properties:
        shifterName: { type: string, description: Name of the shifter. }
        traineeName: { type: string }
        lhcTransitions: { type: string, description: Transitions of the LHC machine during the shift. }
        shiftFlow: { type: string }
        infoForNextShifter: { type: string }
        infoForRmRc: { type: string, description: Information for the run coordinator and the resource manager. }
        runs:
          type: array
          description: Accepted but not used.
          items: { type: object, additionalProperties: true }
        typeSpecific:
          type: [object, 'null']
          description: |
            Depends on `reportType`, and must be given (`null` for `SLIMOS`):
            - `ECS`: `{ environmentComments, runComments }`, objects mapping an environment id or a run number to a comment
            - `QC/PDP`: `{ runComments }`
            - `SL`: `{ magnets }`
            - `DCS`: `{ alerts }`
          properties:
            environmentComments: { type: object, additionalProperties: { type: string }, description: ECS only. Comment by environment id. }
            runComments: { type: object, additionalProperties: { type: string }, description: ECS and QC/PDP only. Comment by run number. }
            magnets:
              type: object
              description: SL only. Configuration of the magnets at the start and at the end of the shift, and in between.
              properties:
                start: { $ref: '#/components/schemas/MagnetsConfiguration' }
                intermediates:
                  type: array
                  items:
                    type: object
                    required: [timestamp]
                    properties:
                      timestamp: { type: string, format: date-time }
                      magnetsConfiguration: { $ref: '#/components/schemas/MagnetsConfiguration' }
                end: { $ref: '#/components/schemas/MagnetsConfiguration' }
            alerts: { type: string, description: DCS only. The DCS alerts. }
    MagnetsConfiguration:
      type: object
      properties:
        solenoid: { type: string, examples: [30kA +452mT] }
        dipole: { type: string, examples: [6kA +681mT] }
    EosReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: The log entry created for the report (see the Logs resource, not yet documented).
          required: [id]
          properties:
            id: { type: integer }
            title: { type: string, description: 'Title of the report, e.g. `End of shift report - ECS - 17/03/2023 Morning`.' }
          additionalProperties: true
    CreateAttachment:
      type: object
      required: [attachments]
      properties:
        log: { type: integer, minimum: 1, description: Identifier of the log to attach the file to. }
        attachments: { type: string, format: binary, description: The file to upload. }
    StoredAttachment:
      type: object
      description: An attachment as stored on the server.
      properties:
        id: { type: integer }
        fileName: { type: string, description: Name of the file on the server (the upload time is prepended to the original name). }
        originalName: { type: string }
        mimeType: { type: string, examples: [image/png] }
        encoding: { type: string, examples: [7bit] }
        size: { type: integer, description: Size of the file in bytes. }
        path: { type: string, description: Path of the file on the server. }
        logId: { type: [integer, 'null'] }
    StoredAttachmentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StoredAttachment' }
    DplDetector:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, description: 'Detector code, e.g. `ITS`.' }
        processesExecutions: { type: array, description: Always empty here., items: { type: object, additionalProperties: true } }
    DplDetectorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DplDetector' }
    DplProcessType:
      type: object
      required: [id, label]
      properties:
        id: { type: integer }
        label: { type: string, examples: [QcTask] }
    DplProcess:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        typeId: { type: integer }
        type: { $ref: '#/components/schemas/DplProcessType' }
        processesExecutions: { type: array, description: Always empty here., items: { type: object, additionalProperties: true } }
    DplProcessListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DplProcess' }
    Host:
      type: object
      required: [id, hostname]
      properties:
        id: { type: integer }
        hostname: { type: string, examples: [flp001] }
        processesExecutions: { type: array, description: Always empty here., items: { type: object, additionalProperties: true } }
    HostListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Host' }
    DplProcessExecution:
      type: object
      required: [id, hostId, processId, detectorId, runNumber]
      properties:
        id: { type: integer }
        hostId: { type: integer }
        processId: { type: integer }
        detectorId: { type: integer }
        runNumber: { type: integer }
        args: { type: [string, 'null'], description: Arguments of the process. }
        detector: { type: 'null', description: Always null here. }
        host: { type: 'null', description: Always null here. }
        process: { type: 'null', description: Always null here. }
        run: { type: 'null', description: Always null here. }
    DplProcessExecutionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DplProcessExecution' }
    Flp:
      type: object
      required: [id, runNumber, name, hostname]
      properties:
        id: { type: integer }
        runNumber: { type: integer }
        name: { type: [string, 'null'], examples: [FLP-1] }
        hostname: { type: [string, 'null'], examples: [flp001.cern.ch] }
        nTimeframes: { type: [integer, 'null'] }
        rootFlpId: { type: [integer, 'null'], description: Identifier of the root FLP role; its own id when it has none. }
        bytesProcessed: { type: [integer, 'null'] }
        bytesEquipmentReadOut: { type: [integer, 'null'] }
        bytesRecordingReadOut: { type: [integer, 'null'] }
        bytesFairMQReadOut: { type: [integer, 'null'] }
        run: { type: [object, 'null'], additionalProperties: true, description: 'Minified run, only when fetching one FLP role.' }
    FlpResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Flp' }
    FlpListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Flp' }
        meta:
          type: object
          properties:
            page: { $ref: '#/components/schemas/PageMeta' }
    CreateFlp:
      type: object
      required: [name, hostname, runNumber]
      properties:
        name: { type: string, minLength: 1 }
        hostname: { type: string, minLength: 1 }
        runNumber: { type: integer, minimum: 1 }
        nTimeframes: { type: number }
        bytesProcessed: { type: number }
        bytesEquipmentReadOut: { type: number }
        bytesRecordingReadOut: { type: number }
        bytesFairMQReadOut: { type: number }
        subtype: { type: string }
    UpdateFlp:
      type: object
      properties:
        nTimeframes: { type: integer, minimum: 0 }
        bytesProcessed: { type: integer, minimum: 0 }
        bytesEquipmentReadOut: { type: integer, minimum: 0 }
        bytesRecordingReadOut: { type: integer, minimum: 0 }
        bytesFairMQReadOut: { type: integer, minimum: 0 }
